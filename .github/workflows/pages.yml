name: Publish site

# The site is served by the legacy Pages builder from the `gh-pages` branch.
#
# Pushing that branch is what re-created the Pages site after it was deleted:
# the Actions deployment path could not be used, because the workflow token is
# not permitted to create a Pages site ("Resource not accessible by integration"
# from actions/configure-pages). Publishing therefore means getting `main` onto
# `gh-pages`, which this workflow does on every push so the two never drift.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror main onto gh-pages
        run: git push --force origin HEAD:gh-pages
